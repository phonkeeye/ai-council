<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>AI COUNCIL - Felix ye 的议会工作台</title>
<style>
:root {
  --bg: #0b1020; --card: #141d30; --border: #293650; --text: #e8edf8; --muted: #94a5c1;
  --deepseek: #f97316; --gpt: #3b82f6; --kimi: #8b5cf6;
  --success: #10b981; --danger: #ef4444; --warn: #f59e0b;
  --primary: #3978ed;
}
* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { margin: 0 0 10px 0; font-size: 24px; letter-spacing: 1px; }
.header p { color: var(--muted); font-size: 13px; margin: 0; }
.header .chairman { color: var(--primary); font-weight: bold; }

.input-area { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
.input-area textarea { width: 100%; height: 80px; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; resize: vertical; font-size: 14px; }
.input-area textarea:focus { outline: none; border-color: var(--primary); }
.btn-submit { width: 100%; margin-top: 10px; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

.status-banner { text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; display: none; }
.status-banner.running { background: rgba(57, 120, 237, 0.2); color: var(--primary); display: block; border: 1px solid var(--primary); }
.status-banner.completed { background: rgba(16, 185, 129, 0.2); color: var(--success); display: block; border: 1px solid var(--success); }
.status-banner.failed { background: rgba(239, 68, 68, 0.2); color: var(--danger); display: block; border: 1px solid var(--danger); }
.status-banner.partial_completed { background: rgba(245, 158, 11, 0.2); color: var(--warn); display: block; border: 1px solid var(--warn); }

.grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
@media (min-width: 768px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
.card-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid; }
.card.deepseek .card-header { border-bottom-color: var(--deepseek); }
.card.gpt .card-header { border-bottom-color: var(--gpt); }
.card.kimi .card-header { border-bottom-color: var(--kimi); }
.card-title { font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 6px; }
.card-role { font-size: 11px; color: var(--muted); margin-top: 2px; }
.badge { padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; }
.badge.pending { background: #34435c; color: #fff; }
.badge.running { background: var(--primary); color: #fff; animation: pulse 1.5s infinite; }
.badge.success { background: var(--success); color: #fff; }
.badge.failed { background: var(--danger); color: #fff; }
.badge.not_configured { background: #475569; color: #fff; }

.card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; }
.time-info { font-size: 11px; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
.content { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; flex: 1; }
.content.error { color: var(--danger); }
.content.waiting { color: var(--muted); font-style: italic; }

@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ AI COUNCIL 议会工作台</h1>
  <p>三模型并发独立分析系统 | 董事长: <span class="chairman">Felix ye</span></p>
</div>

<div class="input-area">
  <textarea id="taskInput" placeholder="Felix ye，请输入本次会议议题..."></textarea>
  <button id="submitBtn" class="btn-submit" onclick="submitTask()">召开三模型会议</button>
</div>

<div id="statusBanner" class="status-banner"></div>

<div class="grid">
  <!-- DeepSeek -->
  <div class="card deepseek" id="card-deepseek">
    <div class="card-header">
      <div>
        <div class="card-title" style="color: var(--deepseek);">🟠 DeepSeek</div>
        <div class="card-role">技术审查官</div>
      </div>
      <span class="badge pending" id="status-deepseek">等待中</span>
    </div>
    <div class="card-body">
      <div class="time-info" id="time-deepseek">未启动</div>
      <div class="content waiting" id="content-deepseek">等待 Felix ye 分配任务...</div>
    </div>
  </div>

  <!-- GPT -->
  <div class="card gpt" id="card-gpt">
    <div class="card-header">
      <div>
        <div class="card-title" style="color: var(--gpt);">🔵 GPT</div>
        <div class="card-role">总协调官</div>
      </div>
      <span class="badge pending" id="status-gpt">等待中</span>
    </div>
    <div class="card-body">
      <div class="time-info" id="time-gpt">未启动</div>
      <div class="content waiting" id="content-gpt">等待 Felix ye 分配任务...</div>
    </div>
  </div>

  <!-- Kimi -->
  <div class="card kimi" id="card-kimi">
    <div class="card-header">
      <div>
        <div class="card-title" style="color: var(--kimi);">🟣 Kimi</div>
        <div class="card-role">研究分析官</div>
      </div>
      <span class="badge pending" id="status-kimi">等待中</span>
    </div>
    <div class="card-body">
      <div class="time-info" id="time-kimi">未启动</div>
      <div class="content waiting" id="content-kimi">等待 Felix ye 分配任务...</div>
    </div>
  </div>
</div>

<script>
const API_BASE = "https://ai-council-proxy.1184313741.workers.dev";
let pollTimer = null;
let isPolling = false;
let pollCount = 0;
const MAX_POLLS = 45;

async function submitTask() {
  const input = document.getElementById("taskInput");
  const btn = document.getElementById("submitBtn");
  const taskText = input.value.trim();

  if (!taskText) {
    alert("Felix ye，请输入议题内容！");
    return;
  }

  btn.disabled = true;
  btn.textContent = "会议发起中...";
  if (pollTimer) clearTimeout(pollTimer);
  isPolling = false;
  pollCount = 0;

  const banner = document.getElementById("statusBanner");
  banner.className = "status-banner";
  banner.style.display = "none";

  const models = ["deepseek", "gpt", "kimi"];
  models.forEach(m => {
    document.getElementById(`status-${m}`).className = "badge pending";
    document.getElementById(`status-${m}`).textContent = "等待中";
    document.getElementById(`time-${m}`).textContent = "未启动";
    const contentDiv = document.getElementById(`content-${m}`);
    contentDiv.className = "content waiting";
    contentDiv.textContent = "等待分配任务...";
  });

  try {
    const res = await fetch(`${API_BASE}/api/council/tasks`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task: taskText })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "提交失败");

    banner.className = "status-banner running";
    banner.textContent = "⏳ 议会进行中，等待各模型返回...";
    isPolling = true;
    pollStatus(data.taskId);

  } catch (error) {
    banner.className = "status-banner failed";
    banner.textContent = "❌ 发起失败: " + error.message;
    btn.disabled = false;
    btn.textContent = "召开三模型会议";
  }
}

async function pollStatus(taskId) {
  if (!isPolling) return;
  if (pollCount >= MAX_POLLS) {
    isPolling = false;
    document.getElementById("statusBanner").className = "status-banner failed";
    document.getElementById("statusBanner").textContent = "⚠️ 轮询超时，请刷新页面查看结果";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").textContent = "召开三模型会议";
    return;
  }

  pollCount++;

  try {
    const res = await fetch(`${API_BASE}/api/council/status/${taskId}`);
    if (!res.ok) throw new Error("查询网络错误");
    
    const data = await res.json();
    renderData(data);

    const activeStates = ["pending", "queued", "running"];
    if (activeStates.includes(data.status)) {
      if (isPolling) {
        pollTimer = setTimeout(() => pollStatus(taskId), 2000);
      }
    } else {
      isPolling = false;
      const banner = document.getElementById("statusBanner");
      banner.className = `status-banner ${data.status}`;
      
      if (data.status === "completed") banner.textContent = "✅ 会议圆满结束 (全部成功)";
      else if (data.status === "partial_completed") banner.textContent = "⚠️ 会议部分完成 (有模型失败)";
      else banner.textContent = "❌ 会议失败 (全部模型异常)";

      document.getElementById("submitBtn").disabled = false;
      document.getElementById("submitBtn").textContent = "召开新会议";
    }

  } catch (error) {
    console.error("轮询失败", error);
    if (isPolling) pollTimer = setTimeout(() => pollStatus(taskId), 5000);
  }
}

function renderData(data) {
  const models = ["deepseek", "gpt", "kimi"];
  
  models.forEach(m => {
    const runInfo = data.results.find(r => r.model_name === m);
    
    const badge = document.getElementById(`status-${m}`);
    const timeDiv = document.getElementById(`time-${m}`);
    const contentDiv = document.getElementById(`content-${m}`);

    if (!runInfo) {
      badge.className = "badge pending";
      badge.textContent = "排队中";
      timeDiv.textContent = "等待启动";
      contentDiv.className = "content waiting";
      contentDiv.textContent = "模型正在准备中...";
      return;
    }

    badge.className = `badge ${runInfo.status}`;
    if (runInfo.status === "success") badge.textContent = "成功";
    else if (runInfo.status === "failed") badge.textContent = "失败";
    else if (runInfo.status === "not_configured") badge.textContent = "未配置";
    else badge.textContent = "执行中";

    if (runInfo.started_at && runInfo.finished_at) {
      const duration = runInfo.finished_at - runInfo.started_at;
      timeDiv.textContent = `耗时: ${duration} ms`;
    } else if (runInfo.started_at && !runInfo.finished_at) {
      const duration = Date.now() - runInfo.started_at;
      timeDiv.textContent = `执行中: ${duration} ms+`;
    } else {
      timeDiv.textContent = "等待启动";
    }

    if (runInfo.summary) {
      if (runInfo.status === "success") {
        contentDiv.className = "content";
        contentDiv.textContent = runInfo.summary;
      } else {
        contentDiv.className = "content error";
        contentDiv.textContent = runInfo.summary;
      }
    } else {
      contentDiv.className = "content waiting";
      contentDiv.textContent = "暂无返回内容";
    }
  });
}
</script>
</body>
</html>
